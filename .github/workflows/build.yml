name: Build LeviLauncher Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: 28.2.13676358

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Configure config-generator build
        shell: bash
        run: |
          cmake -S . -B build-config -G Ninja

      - name: Generate config files
        shell: bash
        run: |
          cmake --build build-config --target levi_generate_config

      - name: Configure Android package build
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=$ANDROID_PLATFORM \
            -DANDROID_STL=c++_shared \
            -DLEVI_PACKAGE_CONFIG_DIR="$GITHUB_WORKSPACE/build-config/generated-config"

      - name: Build Levi mod package
        shell: bash
        run: |
          cmake --build build --target levi_package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: levi-mod-package
          path: build/**/*.levipack
